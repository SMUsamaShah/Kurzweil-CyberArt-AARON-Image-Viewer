name: AARON targeted runtime introspection

on:
  workflow_dispatch:
  push:
    branches: [reverse-engineer-aaron-js]
    paths:
      - '.github/workflows/aaron-introspection.yml'
      - 'research/introspection/*.cl'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        probe: [generic-methods]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download hash-verified reference build
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'AARONsetup.exe'
          $extract = Join-Path $env:RUNNER_TEMP 'aaron-extracted'
          curl.exe --fail --location --output $setup `
            'https://archive.org/download/kurzweilcyberart_aaron/AARONsetup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Reference download failed' }
          node research/tools/extract-installer.mjs `
            $setup $extract "$env:ProgramFiles\7-Zip\7z.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Reference verification failed' }
      - name: Run checkpointed startup probe
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'aaron-introspection'
          try {
            & research/oracle/run-oracle.ps1 `
              -ExtractedRoot (Join-Path $env:RUNNER_TEMP 'aaron-extracted') `
              -OutputRoot $output -Mode direct-screensaver -RunSeconds 30 `
              -TargetPaintings 1 -DisableAaronDep -PatchRegistryRunning `
              -PatchPremiumFlag -PremiumFlagSource '..\introspection\${{ matrix.probe }}.cl'
          } finally {
            $report = 'C:\temp\aaron-${{ matrix.probe }}.txt'
            if (Test-Path $report) {
              Copy-Item $report (Join-Path $output '${{ matrix.probe }}.txt')
              if ('${{ matrix.probe }}' -in @('line-behavior', 'line-validation', 'function-constants', 'object-probe', 'generic-methods', 'ran-float')) {
                Get-Content -LiteralPath $report
              }
            }
          }
          if (-not (Test-Path $report)) { throw 'Probe never started' }
          if (-not (Select-String -LiteralPath $report -SimpleMatch 'END ${{ matrix.probe }}')) {
            throw 'Probe started but did not complete; inspect last checkpoint'
          }
          if ('${{ matrix.probe }}' -eq 'function-constants') {
            node research/tools/parse-function-constants.mjs $report `
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' `
              > (Join-Path $output 'function-constants.json')
            if ($LASTEXITCODE -ne 0) { throw 'Constant report validation failed' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaron-${{ matrix.probe }}
          path: ${{ runner.temp }}/aaron-introspection
          retention-days: 14
