name: AARON post-INIT-RANDOM RAN-HAND trace

on:
  workflow_dispatch:
  push:
    branches: [reverse-engineer-aaron-js]
    paths:
      - '.github/workflows/aaron-ran-hand-trace.yml'
      - 'research/oracle/ran-hand-*.cl'
      - 'research/oracle/planning-random-seed-common.cl'
      - 'research/introspection/planning-call-trace.cl'

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-2022
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: seed-1234
            source: ran-hand-post-init-1234.cl
          - name: seed-1234-repeat
            source: ran-hand-post-init-1234-repeat.cl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download hash-verified reference build
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'AARONsetup.exe'
          $extract = Join-Path $env:RUNNER_TEMP 'aaron-extracted'
          curl.exe --fail --location --retry 2 --retry-all-errors `
            --connect-timeout 20 --max-time 120 --retry-max-time 180 --output $setup `
            'https://archive.org/download/kurzweilcyberart_aaron/AARONsetup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Reference download failed' }
          node research/tools/extract-installer.mjs `
            $setup $extract "$env:ProgramFiles\7-Zip\7z.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Reference verification failed' }
      - name: Stage trace and run RAN-HAND holdout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\temp' | Out-Null
          Copy-Item -LiteralPath 'research\introspection\planning-call-trace.cl' `
            -Destination 'C:\temp\planning-call-trace.cl' -Force
          Copy-Item -LiteralPath 'research\oracle\planning-random-seed-common.cl' `
            -Destination 'C:\temp\planning-random-seed-common.cl' -Force
          Copy-Item -LiteralPath 'research\oracle\ran-hand-trace.cl' `
            -Destination 'C:\temp\ran-hand-trace.cl' -Force
          $output = Join-Path $env:RUNNER_TEMP 'aaron-ran-hand-trace'
          try {
            & research/oracle/run-oracle.ps1 `
              -ExtractedRoot (Join-Path $env:RUNNER_TEMP 'aaron-extracted') `
              -OutputRoot $output -Mode direct-screensaver -RunSeconds 90 `
              -TargetPaintings 1 -DisableAaronDep -PatchRegistryRunning `
              -PatchPremiumFlag -PremiumFlagSource '${{ matrix.source }}'
          } finally {
            foreach ($entry in @(
              @{ Source = 'C:\temp\aaron-ran-hand-trace.txt'; Name = 'ran-hand-trace.txt' },
              @{ Source = 'C:\temp\aaron-ran-hand-source-entered.txt'; Name = 'ran-hand-source-entered.txt' },
              @{ Source = 'C:\temp\aaron-planning-call-trace.txt'; Name = 'planning-call-trace.txt' },
              @{ Source = 'C:\temp\aaron-random-seed-loaded.txt'; Name = 'random-seed-loaded.txt' },
              @{ Source = 'C:\temp\aaron-random-samples.txt'; Name = 'random-samples.txt' },
              @{ Source = 'C:\temp\rseed'; Name = 'rseed' }
            )) {
              if (Test-Path $entry.Source) {
                Copy-Item $entry.Source (Join-Path $output $entry.Name) -Force
              }
            }
          }
          $report = Join-Path $output 'ran-hand-trace.txt'
          $sourceMarker = Join-Path $output 'ran-hand-source-entered.txt'
          if (-not (Test-Path $sourceMarker)) { throw 'RAN-HAND source file was never loaded' }
          if (-not (Test-Path $report)) { throw 'RAN-HAND trace never started' }
          if (-not (Select-String -LiteralPath $report -SimpleMatch 'TRACE-READY T')) {
            $loadError = @(Select-String -LiteralPath (Join-Path $output 'random-samples.txt') `
              -Pattern '^RAN-HAND-LOAD-ERROR-TYPE ')
            if ($loadError.Count -eq 0) {
              throw 'RAN-HAND trace did not finish installing and emitted no load error'
            }
            Write-Warning 'RAN-HAND wrapper load error captured; preserving the diagnostic artifact.'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaron-ran-hand-${{ matrix.name }}
          path: ${{ runner.temp }}/aaron-ran-hand-trace
          if-no-files-found: warn
          retention-days: 14
