name: AARON FREE-PATH boundary matrix

on:
  workflow_dispatch:
  push:
    branches: [reverse-engineer-aaron-js]
    paths:
      - '.github/workflows/aaron-free-path-boundaries.yml'
      - 'research/introspection/free-path-boundaries.cl'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download hash-verified reference build
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'AARONsetup.exe'
          $extract = Join-Path $env:RUNNER_TEMP 'aaron-extracted'
          curl.exe --fail --location --retry 2 --retry-all-errors `
            --connect-timeout 20 --max-time 120 --retry-max-time 180 --output $setup `
            'https://archive.org/download/kurzweilcyberart_aaron/AARONsetup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Reference download failed' }
          node research/tools/extract-installer.mjs `
            $setup $extract "$env:ProgramFiles\7-Zip\7z.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Reference verification failed' }
      - name: Run FREE-PATH boundary matrix
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'aaron-free-path-boundaries'
          New-Item -ItemType Directory -Force -Path 'C:\temp' | Out-Null
          try {
            & research/oracle/run-oracle.ps1 `
              -ExtractedRoot (Join-Path $env:RUNNER_TEMP 'aaron-extracted') `
              -OutputRoot $output -Mode direct-screensaver -RunSeconds 30 `
              -TargetPaintings 1 -DisableAaronDep -PatchRegistryRunning `
              -PatchPremiumFlag -PremiumFlagSource '..\introspection\free-path-boundaries.cl'
          } finally {
            $report = 'C:\temp\aaron-free-path-boundaries.txt'
            if (Test-Path $report) {
              Copy-Item $report (Join-Path $output 'free-path-boundaries.txt') -Force
              Get-Content -LiteralPath $report
            }
          }
          if (-not (Test-Path (Join-Path $output 'free-path-boundaries.txt'))) {
            throw 'FREE-PATH boundary probe never started'
          }
          if (-not (Select-String -LiteralPath (Join-Path $output 'free-path-boundaries.txt') `
                    -SimpleMatch 'END free-path-boundaries')) {
            throw 'FREE-PATH boundary probe started but did not complete'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaron-free-path-boundaries
          path: ${{ runner.temp }}/aaron-free-path-boundaries
          if-no-files-found: warn
          retention-days: 14
